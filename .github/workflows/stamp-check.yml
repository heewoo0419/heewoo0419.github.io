# style·script 의 ?v= 가 파일 내용과 맞는지 확인합니다.
#
# 평소에는 로컬 pre-commit 훅이 자동으로 찍어 줍니다(tools/install-hook.sh).
# 훅을 아직 깔지 않았거나 다른 컴퓨터·웹 편집기로 고친 경우를 여기서 잡습니다.
#
# 이 워크플로는 저장소를 고치지 않습니다. 어긋나면 무엇을 하면 되는지 알려 주고 멈춥니다.
# (Actions 가 직접 커밋하게 하면 봇 커밋이 쌓이고 배포가 두 번 도는 대신,
#  확인만 하면 배포 흐름은 그대로 두면서 빠뜨림만 막을 수 있습니다.)

name: 에셋 버전 확인

on:
  push:
    paths:
      - 'wedding-invitation/**'
  pull_request:
    paths:
      - 'wedding-invitation/**'
  workflow_dispatch:

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: ?v= 를 다시 찍어 본다
        run: python3 wedding-invitation/tools/stamp-assets.py

      - name: 달라진 곳이 있으면 알려 주고 멈춘다
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::html 의 ?v= 가 style·script 의 지금 내용과 어긋나 있습니다."
            echo ""
            echo "이대로 배포하면 방문자가 받아 둔 옛 파일을 계속 쓰게 됩니다."
            echo "아래 중 하나를 해 주세요."
            echo ""
            echo "  1) 훅 깔기 (한 번만):  sh wedding-invitation/tools/install-hook.sh"
            echo "  2) 지금 바로 맞추기:   python3 wedding-invitation/tools/stamp-assets.py"
            echo "                          그리고 바뀐 html 을 함께 커밋"
            echo ""
            echo "고쳐야 할 내용:"
            git --no-pager diff
            exit 1
          fi
          echo "?v= 가 파일 내용과 맞습니다."
